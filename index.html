<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Sign in to Employee Management & Payroll System">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light only">
    <title>Sign In — Employee Management &amp; Payroll System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#login-form">Skip to sign in form</a>

    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-heading">
            <header class="login-header">
                <h1 id="login-heading" class="login-brand">
                    Employee Management &amp; Payroll System
                </h1>
                <p class="login-subtitle">Sign in to your account</p>
            </header>

            <div class="login-body">
                <div
                    id="login-alert"
                    class="auth-alert"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

                <form
                    id="login-form"
                    class="form"
                    autocomplete="on"
                    novalidate
                >
                    <div class="form-group">
                        <label for="email" class="form-label">
                            Email address
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            autocomplete="email"
                            inputmode="email"
                            spellcheck="false"
                            autocapitalize="off"
                            autocorrect="off"
                            required
                            aria-describedby="email-error"
                        >
                        <p
                            id="email-error"
                            class="form-error"
                            hidden
                        ></p>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            autocomplete="current-password"
                            required
                            minlength="6"
                            aria-describedby="password-error"
                        >
                        <p
                            id="password-error"
                            class="form-error"
                            hidden
                        ></p>
                    </div>

                    <div class="form-actions">
                        <button
                            type="submit"
                            id="login-submit"
                            class="btn btn-primary btn-block btn-lg"
                            disabled
                        >
                            Preparing sign in…
                        </button>
                    </div>
                </form>
            </div>

            <footer class="login-footer">
                <p><strong>Employee Management &amp; Payroll System</strong></p>
                <p>Designed and Developed by Yadav Web Technologies</p>
            </footer>
        </section>
    </main>

    <noscript>
        <p class="auth-alert" role="alert">
            JavaScript is required to sign in to this application.
        </p>
    </noscript>

    <script type="module">
        (async () => {
            try {
                const { initLoginPage } = await import('./js/auth.js');
                initLoginPage();
            } catch (error) {
                const alertEl = document.getElementById('login-alert');
                if (alertEl) {
                    alertEl.textContent =
                        'Unable to initialize the sign in page. Please reload the page.';
                    alertEl.hidden = false;
                }
                const submit = document.getElementById('login-submit');
                if (submit) {
                    submit.disabled = true;
                }
            }
        })();
    </script>
</body>
</html>
